        <title>Confirmation de l'adresse email - BricoleUp</title>
        <link rel="icon" href="{% static 'app/images/bricoleupicon.png' %}" type="image">
        <!-- CSS FILES -->        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <body id="top">
            <!-- Google Tag Manager (noscript) -->
        <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5KL4XBDB"
        height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
        <!-- End Google Tag Manager (noscript) -->
    <main id="content" style="display:none;">
        
        <div class="container mt-5">
      
                        
            <div class="row justify-content-center align-items-center">
                <div class="col-md-6 col-md-offset-3">
                
                        
                    <!-- fieldsets -->
                    <div class="topics-detail-block bg-white shadow-lg mb-2 p-4">
    
                        <div class="row">
                            {% if error_message %}
                                <div class="alert alert-danger">
                                    {{ error_message }}
                                </div>
                            {% else %}
                                <div class="alert alert-success">
                                    {{ success_message }}
                                </div>
                            {% endif %}
                        

                        </div>
                    </div>
                        
                        
                </div>
            
            </div>
       
    </div>
</main>
<!-- Preloader -->
<div id="preloader">
<div class="loader"></div>
</div>
<script>
window.addEventListener("load", function() {
    document.getElementById("preloader").style.display = "none";
    document.getElementById("content").style.display = "block";
});
</script>

<style>
    /* Preloader Styles */
    #preloader {
        position: fixed;
        width: 100%;
        height: 100%;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
    }
    .loader {
        border: 6px solid #f3f3f3;
        border-top: 6px solid #ec700a ;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>



</body>
